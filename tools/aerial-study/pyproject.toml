[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "BLE"]
# FastAPI intentionally uses function calls (Depends/File/Form) as parameter
# defaults; B008 is a false positive for this framework.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
