name: aerial-study

services:
  study:
    build:
      context: .
      dockerfile: Dockerfile
    image: aerial-study:latest
    container_name: aerial-study
    restart: unless-stopped
    ports:
      - "${PORT:-8900}:8900"
    volumes:
      # NAS deployment path from the Aerial Study Guard design.
      - /vol2/1000/study:/data
    environment:
      # Compose reads .env in this directory for interpolation.  Keys below are
      # passed explicitly so `docker compose config` is reviewable.
      TZ: ${TZ:-Asia/Shanghai}
      DATA_DIR: /data
      IMAGES_DIR: /data/images
      MATERIALS_DIR: /data/materials
      DB_PATH: /data/study.db
      STUDY_DEVICE_TOKEN: ${STUDY_DEVICE_TOKEN:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_SECRET_KEY: ${ADMIN_SECRET_KEY:-}
      ADMIN_SESSION_HOURS: ${ADMIN_SESSION_HOURS:-12}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-24}
      QUESTIONS_PER_SESSION: ${QUESTIONS_PER_SESSION:-5}
      IMAGE_MAX_MB: ${IMAGE_MAX_MB:-10}
      ASR_MODEL: ${ASR_MODEL:-small}
      ASR_DEVICE: ${ASR_DEVICE:-cpu}
      ASR_COMPUTE_TYPE: ${ASR_COMPUTE_TYPE:-int8}
      ASR_LANGUAGE: ${ASR_LANGUAGE:-auto}
      ASR_BEAM_SIZE: ${ASR_BEAM_SIZE:-1}
      ASR_MAX_MB: ${ASR_MAX_MB:-20}
      ASR_QUEUE_SIZE: ${ASR_QUEUE_SIZE:-8}
      ASR_TIMEOUT_SECONDS: ${ASR_TIMEOUT_SECONDS:-120}
      ASR_PCM_SAMPLE_RATE: ${ASR_PCM_SAMPLE_RATE:-16000}
      ASR_PCM_CHANNELS: ${ASR_PCM_CHANNELS:-1}
      ASR_PCM_SAMPLE_WIDTH: ${ASR_PCM_SAMPLE_WIDTH:-2}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      DEEPSEEK_AUTH_HEADER: ${DEEPSEEK_AUTH_HEADER:-Authorization}
      XIAOMI_MIMO_API_KEY: ${XIAOMI_MIMO_API_KEY:-}
      XIAOMI_MIMO_BASE_URL: ${XIAOMI_MIMO_BASE_URL:-}
      XIAOMI_MIMO_MODEL: ${XIAOMI_MIMO_MODEL:-}
      XIAOMI_MIMO_AUTH_HEADER: ${XIAOMI_MIMO_AUTH_HEADER:-Authorization}
      AI_PROVIDER: ${AI_PROVIDER:-deepseek}
      AI_JUDGE_ENABLED: ${AI_JUDGE_ENABLED:-0}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-60}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8900/health', timeout=3).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
